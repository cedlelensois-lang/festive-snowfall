name: Release ZIP

# Runs when a release is published from the GitHub UI, or when a v* tag is pushed.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n "s/^ \* Version: *//p" festive-snowfall.php | tr -d '[:space:]')
          echo "Tag: $TAG / Plugin version: $VERSION"
          test "$TAG" = "$VERSION"

      - name: Build installable ZIP (respects .gitattributes export-ignore)
        run: git archive --format=zip --prefix=festive-snowfall/ -o festive-snowfall.zip HEAD

      - name: Attach ZIP to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: festive-snowfall.zip
          overwrite_files: true
          generate_release_notes: true
